<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrollyteller</title>
<style>
:root{
  --bg:#eef0f3; --panel:#fff; --line:#d6dae0; --ink:#1d2330; --muted:#6b7280;
  --accent:#2f6fed; --text-clip:#3b82f6; --img-clip:#f59e0b; --playhead:#e11d48; --danger:#dc2626;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);
  display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{padding:6px 10px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;white-space:nowrap}
button:hover{background:#eef3ff}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{background:#2159c9}
button.danger{color:var(--danger)}
button:disabled{opacity:.4;cursor:default}

header{display:flex;gap:6px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0 10px 0 0}
header .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
header .grow{flex:1}

main{display:grid;grid-template-columns:minmax(300px,30%) 1fr 310px;min-height:0}

/* ---------- timeline ---------- */
#tl-panel{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0}
#tl-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
#tl-bar .grow{flex:1}
#tl-bar button{padding:2px 8px}
#tl-scroll{flex:1;overflow:auto;position:relative;user-select:none}
#tl-heads{position:sticky;top:0;height:26px;background:#f8f9fb;border-bottom:1px solid var(--line);z-index:5}
#tl-heads div{position:absolute;top:0;height:26px;line-height:26px;font-size:11px;color:var(--muted);text-align:center}
#tl-body{position:relative;cursor:crosshair}
.tick{position:absolute;left:0;right:0;height:0;border-top:1px solid #e5e8ec;font-size:11px;color:var(--muted);padding-left:6px}
.tick.minor{border-top-style:dotted;border-color:#eef0f3}
.tick span{position:relative;top:-8px;background:#fff;padding:0 2px}
.lane{position:absolute;top:0;bottom:0;border-left:1px dashed #e1e4e8}
.endzone{position:absolute;right:0;bottom:0;background:repeating-linear-gradient(-45deg,#f3f4f6 0 6px,#e9ebef 6px 12px);border-top:2px solid #9ca3af}
.endzone span{position:absolute;right:6px;top:2px;font-size:11px;color:var(--muted)}
.clip{position:absolute;border-radius:6px;overflow:hidden;cursor:grab;color:#fff;font-size:12px;
  box-shadow:0 1px 2px rgba(0,0,0,.2);border:2px solid transparent}
.clip.text{background:var(--text-clip)}
.clip.image{background:var(--img-clip)}
.clip.sel{border-color:#111;box-shadow:0 0 0 2px #fff,0 0 0 4px #111}
.clip .lbl{position:absolute;inset:8px 6px;overflow:hidden;line-height:1.25;pointer-events:none;word-break:break-word}
.clip .lbl img{display:block;max-width:100%;max-height:48px;border-radius:3px;margin-top:3px;background:#fff}
.clip .shade{position:absolute;left:0;right:0;pointer-events:none}
.clip .shade.in{top:0;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0))}
.clip .shade.out{bottom:0;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.55))}
.clip .h{position:absolute;left:0;right:0;height:8px;cursor:ns-resize;z-index:2}
.clip .h-top{top:0}.clip .h-bot{bottom:0}
.clip .h::after{content:"";position:absolute;left:50%;width:22px;margin-left:-11px;height:3px;border-radius:2px;background:rgba(255,255,255,.8);top:2px}
#playhead{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--playhead);pointer-events:none;z-index:4}
#playhead::before{content:"";position:absolute;left:0;top:-7px;border:6px solid transparent;border-left:9px solid var(--playhead)}
#tl-empty{position:absolute;left:50px;right:12px;top:60px;color:var(--muted);text-align:center;pointer-events:none}

/* ---------- preview ---------- */
#pv-panel{display:flex;flex-direction:column;min-width:0;min-height:0}
#pv-area{flex:1;display:grid;place-items:center;min-height:0;padding:14px}
#pv-frame{position:relative;box-shadow:0 4px 18px rgba(0,0,0,.25);background:#000}
#stage{position:absolute;inset:0;overflow:hidden;container-type:size}
#overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#selbox{position:absolute;outline:2px dashed #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.6);pointer-events:auto;cursor:move;display:none}
#selbox .rz{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;background:#fff;border:2px solid #111;border-radius:3px;cursor:nwse-resize}
#pv-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-top:1px solid var(--line)}
#pv-bar input[type=range]{flex:1}
#pv-bar .hint{font-size:12px;color:var(--muted)}
#ph-label{font-variant-numeric:tabular-nums;min-width:120px}

/* ---------- inspector ---------- */
#inspector{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px 14px 40px}
#inspector h2{font-size:15px;margin:0}
#inspector h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 8px}
#inspector h3 small{text-transform:none;letter-spacing:0;font-weight:400}
#inspector label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#374151;margin-bottom:8px}
#inspector label.check{flex-direction:row;align-items:center;gap:6px}
#inspector input[type=text],#inspector input[type=number],#inspector select,#inspector textarea{
  width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:#fff}
#inspector textarea{resize:vertical;min-height:70px}
.rt-bar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.rt-bar button,.rt-bar .rt-color{padding:2px 8px;font-size:12px;min-width:28px}
.rt-bar .rt-color{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.rt-bar .rt-color input{width:22px;height:18px;border:0;padding:0;background:none;cursor:pointer}
.rt{min-height:90px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 8px;
  background:#fff;white-space:pre-wrap;overflow-wrap:break-word;margin-bottom:8px;outline:none}
.rt:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(47,111,237,.2)}
.rt a{color:#2563eb;text-decoration:underline}
.rt p{margin:0}.rt ul,.rt ol{margin:0;padding-left:1.3em}
#inspector input[type=color]{width:100%;height:30px;border:1px solid var(--line);border-radius:6px;padding:2px;background:#fff}
#inspector input[type=range]{width:100%}
#inspector .val{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 6px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.ins-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.presets{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.presets button{padding:3px 8px;font-size:12px}
.cam{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.cam-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cam-head button{padding:2px 8px;font-size:12px}
.hint{font-size:12px;color:var(--muted);margin:4px 0 8px}
#inspector ol{padding-left:18px;margin:6px 0;font-size:13px}
#inspector li{margin-bottom:6px}

#toast{position:fixed;right:16px;bottom:16px;background:#111827;color:#fff;padding:10px 14px;border-radius:8px;
  opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;max-width:360px;z-index:100}
#toast.show{opacity:1;transform:none}
body.dragover::after{content:"Drop images to add them";position:fixed;inset:0;display:grid;place-items:center;
  background:rgba(47,111,237,.15);border:4px dashed var(--accent);font-size:24px;color:var(--accent);z-index:99}
</style>
</head>
<body>
<header>
  <h1>📜 Scrollyteller</h1>
  <button class="primary" data-cmd="addText">+ Text</button>
  <button class="primary" data-cmd="addImage">+ Image</button>
  <span class="sep"></span>
  <button data-cmd="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
  <button data-cmd="redo" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
  <span class="grow"></span>
  <button data-cmd="newProject">New</button>
  <button data-cmd="open" title="Open a saved project or an exported story">Open…</button>
  <button data-cmd="save" title="Download your project so you can keep working on it later">Save project</button>
  <span class="sep"></span>
  <button data-cmd="preview">▶ Preview story</button>
  <button class="primary" data-cmd="export">⬇ Export HTML</button>
</header>

<main>
  <section id="tl-panel">
    <div id="tl-bar">
      <span>Timeline · 1 numbered block = 1 screen of scrolling</span>
      <span class="grow"></span>
      <button data-cmd="zoomOut" title="Zoom timeline out">−</button>
      <button data-cmd="zoomIn" title="Zoom timeline in">+</button>
    </div>
    <div id="tl-scroll">
      <div id="tl-heads"></div>
      <div id="tl-body"></div>
    </div>
  </section>

  <section id="pv-panel">
    <div id="pv-area">
      <div id="pv-frame">
        <div id="stage"></div>
        <div id="overlay"><div id="selbox"><div class="rz"></div></div></div>
      </div>
    </div>
    <div id="pv-bar">
      <span id="ph-label"></span>
      <input id="ph-slider" type="range" min="0" step="0.01" aria-label="Scroll position">
      <span class="hint">Scroll over the preview to scrub</span>
    </div>
  </section>

  <aside id="inspector"></aside>
</main>
<div id="toast"></div>

<script>
/* ===================================================================
   Runtime: shared by the editor preview AND the exported story.
   It must stay self-contained (no outside variables) because its
   source code is copied verbatim into every exported HTML file.
   =================================================================== */
function scrollyRuntime(){
  function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
  function ease(p){return 1-Math.pow(1-p,3)}
  function smooth(p){return p*p*(3-2*p)}
  function rgba(hex,a){var n=parseInt(hex.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'}

  // p goes 0 -> 1 as an entrance plays (or 1 -> 0 as an exit plays)
  function fx(name,p){
    var r={o:1,x:0,y:0,s:1};
    if(!name||name==='none'||p>=1)return r;
    var e=ease(clamp(p,0,1)),q=1-e;
    if(name==='fade')r.o=e;
    else if(name==='left')r.x=-110*q;
    else if(name==='right')r.x=110*q;
    else if(name==='bottom')r.y=110*q;
    else if(name==='top')r.y=-110*q;
    else if(name==='zoom'){r.s=.3+.7*e;r.o=e}
    return r;
  }

  function length(p){
    if(p.length>0)return p.length;
    var m=0;p.clips.forEach(function(c){m=Math.max(m,c.end)});
    return Math.max(1,m);
  }

  function mount(stage,p){
    stage.innerHTML='';
    stage.style.background=p.bg;
    return p.clips.map(function(c){
      var el=document.createElement('div'),img=null,txt=null;
      el.className='sc-clip';el.style.display='none';
      if(c.type==='image'){
        var box=document.createElement('div');box.className='sc-imgbox';
        img=document.createElement('img');img.src=c.src;img.alt=c.alt||'';img.draggable=false;
        box.appendChild(img);el.appendChild(box);
      }else{
        txt=document.createElement('div');txt.className='sc-text';txt.innerHTML=c.html;el.appendChild(txt);
      }
      stage.appendChild(el);
      return {c:c,el:el,img:img,txt:txt};
    });
  }

  function update(mounted,t){
    mounted.forEach(function(m){
      var c=m.c,el=m.el,s=el.style;
      if(t<c.start||t>c.end){s.display='none';return}
      s.display='';
      var dur=c.end-c.start,prog=dur>0?clamp((t-c.start)/dur,0,1):0;
      s.left=c.x+'%';s.top=c.y+'%';s.width=c.w+'%';
      s.height=c.type==='image'?c.h+'%':'auto';
      s.zIndex=c.lane+1;
      if(m.txt){
        var ts=m.txt.style,box=c.bgOpacity>0;
        ts.fontSize=(c.size/10)+'cqmin';ts.color=c.color;ts.textAlign=c.align;
        ts.fontWeight=c.bold?'700':'400';ts.fontFamily=c.font;
        ts.background=box?rgba(c.bg,c.bgOpacity/100):'transparent';
        ts.padding=box?'.5em .8em':'0';ts.borderRadius=box?'.35em':'0';
      }
      if(m.img){
        var k=c.kb,kp=smooth(prog),
            z=k.z0+(k.z1-k.z0)*kp,px=k.x0+(k.x1-k.x0)*kp,py=k.y0+(k.y1-k.y0)*kp,
            lim=(z-1)/(2*z)*100; // furthest we can pan without showing an edge
        m.img.style.objectFit=c.fit;
        m.img.style.transform='scale('+z+') translate('+(-px/100*lim)+'%,'+(-py/100*lim)+'%)';
      }
      var a=fx(c.enter,c.enterLen>0?(t-c.start)/c.enterLen:1),
          b=fx(c.exit,c.exitLen>0?(c.end-t)/c.exitLen:1),
          y=a.y+b.y+(c.motion==='drift'?(1-2*prog)*60:0);
      s.opacity=a.o*b.o;
      s.transform='translate('+(a.x+b.x)+'cqw,'+y+'cqh) scale('+(a.s*b.s)+')';
    });
  }

  return {mount:mount,update:update,length:length};
}

var RUNTIME_CSS=
  '.sc-clip{position:absolute;box-sizing:border-box;transform-origin:center;will-change:transform,opacity}'+
  '.sc-text{white-space:pre-wrap;line-height:1.25;overflow-wrap:break-word;box-sizing:border-box}'+
  '.sc-text a{color:inherit;text-decoration:underline;text-underline-offset:.15em}'+
  '.sc-text p{margin:0}.sc-text ul,.sc-text ol{margin:0;padding-left:1.3em}'+
  '.sc-imgbox{width:100%;height:100%;overflow:hidden}'+
  '.sc-imgbox img{width:100%;height:100%;display:block;transform-origin:center;user-select:none}';

/* ===================================================================
   Editor
   =================================================================== */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const snap=v=>Math.round(v*10)/10;
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const RT=scrollyRuntime();
const STORE_KEY='scrollyteller-project';
const RULER=40;

const FONTS=[
  ['Clean (sans-serif)','system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'],
  ['Classic (serif)','Georgia, "Times New Roman", serif'],
  ['Typewriter','"Courier New", ui-monospace, monospace'],
  ['Headline','Impact, "Arial Black", sans-serif'],
  ['Handwritten','"Comic Sans MS", "Comic Neue", "Chalkboard SE", cursive'],
];
const ENTER=[['none','Just appear'],['fade','Fade in'],['left','Slide in from the left'],['right','Slide in from the right'],
  ['bottom','Slide up from the bottom'],['top','Slide down from the top'],['zoom','Zoom in']];
const EXIT=[['none','Just disappear'],['fade','Fade out'],['left','Slide out to the left'],['right','Slide out to the right'],
  ['top','Slide out the top'],['bottom','Slide out the bottom'],['zoom','Shrink away']];
const PRESETS={
  text:{'Left':{x:5,y:30,w:40},'Right':{x:55,y:30,w:40},'Center':{x:15,y:38,w:70},'Top':{x:10,y:8,w:80},'Bottom':{x:10,y:72,w:80}},
  image:{'Full screen':{x:0,y:0,w:100,h:100},'Left':{x:3,y:10,w:47,h:80},'Right':{x:50,y:10,w:47,h:80},'Center':{x:15,y:10,w:70,h:80}},
};

let project, sel=null, playhead=0, pxPer=90;
let undoStack=[], redoStack=[], lastSaved='';
let mounted=[], mountKey='';
const thumbs=new Map();

/* ---------- rich text ---------- */
const textToHtml=t=>esc(t).replace(/\n/g,'<br>');
const KEEP_TAGS=new Set(['B','STRONG','I','EM','U','A','BR','DIV','P','UL','OL','LI','SPAN','FONT']);
const DROP_TAGS=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','TEMPLATE','META','LINK','TITLE','HEAD']);
// Only simple formatting, colors and http(s)/mailto links survive; everything else is stripped.
function sanitize(html){
  const body=new DOMParser().parseFromString(`<body>${html}</body>`,'text/html').body;
  (function walk(node){
    for(let ch of [...node.childNodes]){
      if(ch.nodeType===3)continue;
      if(ch.nodeType!==1||DROP_TAGS.has(ch.tagName)){ch.remove();continue}
      if(!KEEP_TAGS.has(ch.tagName)){walk(ch);ch.replaceWith(...ch.childNodes);continue}
      const color=ch.tagName==='FONT'?ch.getAttribute('color'):ch.style.color;
      const href=(ch.getAttribute('href')||'').trim();
      if(ch.tagName==='FONT'){const s=document.createElement('span');s.append(...ch.childNodes);ch.replaceWith(s);ch=s}
      for(const a of [...ch.attributes])ch.removeAttribute(a.name);
      if(color)ch.style.color=color;
      if(ch.tagName==='A'){
        if(!/^(https?:|mailto:)/i.test(href)){walk(ch);ch.replaceWith(...ch.childNodes);continue}
        ch.setAttribute('href',href);ch.setAttribute('target','_blank');ch.setAttribute('rel','noopener');
      }
      if(ch.tagName==='SPAN'&&!ch.getAttribute('style')){walk(ch);ch.replaceWith(...ch.childNodes);continue}
      walk(ch);
    }
  })(body);
  return body.innerHTML;
}
function htmlToText(html){
  const t=document.createElement('template');
  t.innerHTML=html.replace(/<br\s*\/?>|<\/(div|p|li)>/gi,' $&');
  return t.content.textContent;
}

/* ---------- model ---------- */
function newClip(type,over){
  const base={id:uid(),type,lane:0,start:0,end:1.5,x:10,y:35,w:40,h:40,
    enter:'fade',enterLen:.3,exit:'fade',exitLen:.3,motion:'none'};
  const extra=type==='text'
    ?{html:'Your text here',size:40,color:'#ffffff',font:FONTS[0][1],bold:false,align:'left',bg:'#000000',bgOpacity:0}
    :{src:'',name:'image',alt:'',fit:'contain',x:15,y:10,w:70,h:80,kb:{z0:1,x0:0,y0:0,z1:1,x1:0,y1:0}};
  const c=Object.assign(base,extra,over||{});
  if(c.type==='image')c.kb=Object.assign({z0:1,x0:0,y0:0,z1:1,x1:0,y1:0},c.kb);
  if(c.type==='text'){
    // older projects stored plain text in `text`
    if(over&&over.html==null&&over.text!=null)c.html=textToHtml(over.text);
    delete c.text;
    c.html=sanitize(c.html);
  }
  return c;
}
function normalize(p){
  const out=Object.assign({version:1,title:'My story',bg:'#0f172a',length:0,progress:true,lanes:4,aspect:'16/9',clips:[]},p);
  out.clips=(out.clips||[]).filter(c=>c&&(c.type==='text'||c.type==='image')).map(c=>newClip(c.type,c));
  out.lanes=clamp(out.lanes|0,1,8);
  return out;
}
const byId=id=>project.clips.find(c=>c.id===id);
const storyLen=()=>RT.length(project);

/* ---------- history / saving ---------- */
function commit(){
  const now=JSON.stringify(project);
  if(now===lastSaved)return;
  undoStack.push(lastSaved);
  if(undoStack.length>60)undoStack.shift();
  redoStack=[];
  lastSaved=now;
  persist();
  updateButtons();
}
function persist(){
  try{localStorage.setItem(STORE_KEY,lastSaved)}
  catch(e){toast('This project is too big to auto-save in the browser. Use “Save project” to keep it.')}
}
function restore(json){
  project=normalize(JSON.parse(json));
  lastSaved=JSON.stringify(project);
  if(sel&&!byId(sel))sel=null;
  persist();refreshAll();
}
function undo(){if(!undoStack.length)return;redoStack.push(lastSaved);restore(undoStack.pop());updateButtons()}
function redo(){if(!redoStack.length)return;undoStack.push(lastSaved);restore(redoStack.pop());updateButtons()}
function updateButtons(){
  $('[data-cmd=undo]').disabled=!undoStack.length;
  $('[data-cmd=redo]').disabled=!redoStack.length;
}
function loadProject(p,keepHistory){
  if(keepHistory&&project)undoStack.push(lastSaved);
  else{undoStack=[];redoStack=[]}
  project=normalize(p);sel=null;playhead=0;
  lastSaved=JSON.stringify(project);
  persist();updateButtons();refreshAll();
}

/* ---------- rendering ---------- */
function refreshAll(){render();renderInspector();sizeFrame()}
function render(){renderTimeline();renderPreview()}

function laneW(){return Math.max(60,($('#tl-scroll').clientWidth-RULER)/project.lanes)}

function renderTimeline(){
  const L=storyLen(), lw=laneW(), total=Math.max(L+3,playhead+1,8);
  const body=$('#tl-body');
  body.style.height=total*pxPer+'px';
  body.style.width=(RULER+lw*project.lanes)+'px';
  let h='';
  for(let i=0;i<=Math.ceil(total*2);i++){
    const v=i/2;
    h+=`<div class="tick${i%2?' minor':''}" style="top:${v*pxPer}px">${i%2?'':`<span>${v}</span>`}</div>`;
  }
  for(let i=0;i<project.lanes;i++)h+=`<div class="lane" style="left:${RULER+i*lw}px;width:${lw}px"></div>`;
  h+=`<div class="endzone" style="top:${L*pxPer}px;left:${RULER}px"><span>End of story</span></div>`;
  for(const c of project.clips){
    const dur=c.end-c.start, top=c.start*pxPer, ht=Math.max(dur*pxPer,10);
    let label;
    if(c.type==='text')label=esc(htmlToText(c.html).trim().slice(0,80)||'(empty text)');
    else{
      const th=thumbFor(c.src);
      label=`🖼 ${esc(c.name)}${th?`<img src="${th}" alt="">`:''}`;
    }
    const sIn=c.enter!=='none'?Math.min(c.enterLen,dur)*pxPer:0, sOut=c.exit!=='none'?Math.min(c.exitLen,dur)*pxPer:0;
    h+=`<div class="clip ${c.type}${c.id===sel?' sel':''}" data-id="${c.id}"
      style="top:${top}px;height:${ht}px;left:${RULER+c.lane*lw+3}px;width:${lw-6}px">
      ${sIn?`<div class="shade in" style="height:${sIn}px"></div>`:''}
      ${sOut?`<div class="shade out" style="height:${sOut}px"></div>`:''}
      <div class="lbl">${label}</div>
      <div class="h h-top"></div><div class="h h-bot"></div></div>`;
  }
  h+=`<div id="playhead" style="top:${playhead*pxPer}px"></div>`;
  if(!project.clips.length)h+=`<div id="tl-empty">Click <b>+ Text</b> or <b>+ Image</b> to add something.<br><br>You can also drag image files here, or paste a screenshot of a chart (Ctrl+V).</div>`;
  body.innerHTML=h;
  let heads='';
  for(let i=0;i<project.lanes;i++)heads+=`<div style="left:${RULER+i*lw}px;width:${lw}px">Layer ${i+1}${i===project.lanes-1&&project.lanes>1?' (top)':''}</div>`;
  $('#tl-heads').innerHTML=heads;
  $('#tl-heads').style.width=body.style.width;
}

function thumbFor(src){
  if(!src)return '';
  if(thumbs.has(src))return thumbs.get(src);
  thumbs.set(src,'');
  const img=new Image();
  img.onload=()=>{
    const s=Math.min(1,120/Math.max(img.width||120,img.height||120));
    const cv=document.createElement('canvas');
    cv.width=Math.max(1,Math.round((img.width||120)*s));cv.height=Math.max(1,Math.round((img.height||120)*s));
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    thumbs.set(src,cv.toDataURL());
    renderTimeline();
  };
  img.src=src;
  return '';
}

function renderPreview(){
  const key=project.bg+'|'+project.clips.map(c=>c.id+':'+(c.type==='text'?c.html:c.src.length+c.alt)).join('|');
  if(key!==mountKey){mounted=RT.mount($('#stage'),project);mountKey=key}
  RT.update(mounted,playhead);
  positionSelBox();
  const L=storyLen();
  $('#ph-label').textContent=`Screen ${playhead.toFixed(1)} of ${L}`;
  const sl=$('#ph-slider');sl.max=L;sl.value=playhead;
}

function positionSelBox(){
  const box=$('#selbox'), c=sel&&byId(sel), m=c&&mounted.find(m=>m.c===c);
  if(!m||m.el.style.display==='none'){box.style.display='none';return}
  const fh=$('#pv-frame').clientHeight||1;
  box.style.display='block';
  box.style.left=c.x+'%';box.style.top=c.y+'%';box.style.width=c.w+'%';
  box.style.height=c.type==='image'?c.h+'%':(m.el.offsetHeight/fh*100)+'%';
}

function setPlayhead(t,reveal){
  playhead=clamp(t,0,storyLen());
  $('#playhead')&&($('#playhead').style.top=playhead*pxPer+'px');
  renderPreview();
  if(reveal){
    const sc=$('#tl-scroll'), y=playhead*pxPer+26;
    if(y<sc.scrollTop+40||y>sc.scrollTop+sc.clientHeight-40)sc.scrollTop=y-sc.clientHeight/2;
  }
}

function sizeFrame(){
  const area=$('#pv-area'), ar=project.aspect==='9/16'?9/16:16/9;
  const aw=area.clientWidth-28, ah=area.clientHeight-28;
  let w=Math.min(aw,ah*ar);w=Math.max(w,50);
  const f=$('#pv-frame');f.style.width=w+'px';f.style.height=(w/ar)+'px';
  positionSelBox();
}

}

function getPath(o,k){return k.split('.').reduce((a,p)=>a==null?a:a[p],o)}
function setPath(o,k,v){const ps=k.split('.'),last=ps.pop();ps.reduce((a,p)=>a[p],o)[last]=v}

function renderInspector(){
  const c=sel&&byId(sel), box=$('#inspector');
  box.innerHTML=c?clipForm(c):projectForm();
  box.querySelectorAll('[data-k]').forEach(inp=>{
    const v=getPath(inp.dataset.scope==='project'?project:c,inp.dataset.k);
    if(inp.type==='checkbox')inp.checked=!!v;else inp.value=v;
  });
  if(c&&c.type==='text')$('#rt').innerHTML=c.html;
  rtRange=null;
  updateReadouts();
}
const isTyping=el=>!!el&&(/INPUT|TEXTAREA|SELECT/.test(el.tagName)||el.isContentEditable);
// refresh field values without rebuilding (so typing isn't interrupted)
function syncInspector(){
  const box=$('#inspector');
  if(box.contains(document.activeElement)&&isTyping(document.activeElement)){
    const c=sel&&byId(sel);
    box.querySelectorAll('[data-k]').forEach(inp=>{
      if(inp===document.activeElement)return;
      const v=getPath(inp.dataset.scope==='project'?project:c,inp.dataset.k);
      if(inp.type==='checkbox')inp.checked=!!v;else inp.value=v;
    });
    updateReadouts();
  }else renderInspector();
}
function updateReadouts(){
  $('#inspector').querySelectorAll('input[type=range]').forEach(r=>{
    const out=r.parentElement.querySelector('.val');if(!out)return;
    const k=r.dataset.k,v=+r.value;
    out.textContent=/Len$/.test(k)?`${v} screens`:/^kb\.z/.test(k)?`${v.toFixed(2)}×`:/bgOpacity/.test(k)?`${v}%`:/^kb/.test(k)?`${v}`:`${v}`;
  });
}

function applyField(inp){
  const isProj=inp.dataset.scope==='project', obj=isProj?project:byId(sel);
  if(!obj)return;
  const k=inp.dataset.k;
  let v;
  if(inp.type==='checkbox')v=inp.checked;
  else if(inp.type==='number'||inp.type==='range'){
    v=parseFloat(inp.value);if(isNaN(v))return;
    if(inp.min!=='')v=Math.max(+inp.min,v);
    if(inp.max!=='')v=Math.min(+inp.max,v);
  }else v=inp.value;
  setPath(obj,k,v);
  if(isProj){
    if(k==='lanes'){project.lanes=Math.round(v);project.clips.forEach(c=>c.lane=Math.min(c.lane,project.lanes-1))}
    if(k==='aspect')sizeFrame();
  }else{
    if(obj.end<obj.start+0.1&&(k==='start'||k==='end')&&inp!==document.activeElement)obj.end=snap(obj.start+0.1);
    // show the moment being edited
    if(/^kb\.\w0$/.test(k))setPlayhead(obj.start+Math.min(obj.enterLen,(obj.end-obj.start)/2));
    if(/^kb\.\w1$/.test(k))setPlayhead(obj.end-Math.min(obj.exitLen,(obj.end-obj.start)/2));
  }
  updateReadouts();
  render();
}

function clipAction(act,btn){
  const c=byId(sel);if(!c)return;
  if(act==='del')deleteSel();
  else if(act==='dup')duplicateSel();
  else if(act==='preset'){Object.assign(c,PRESETS[c.type][btn.dataset.p]);render();commit();syncInspector()}
  else if(act==='replace')pickFiles('image/*').then(fs=>fs[0]&&readImage(fs[0])).then(r=>{if(!r)return;c.src=r.src;c.name=r.name;render();commit()});
  else if(act==='camstart')setPlayhead(c.start+Math.min(c.enterLen,(c.end-c.start)/2),true);
  else if(act==='camend')setPlayhead(c.end-Math.min(c.exitLen,(c.end-c.start)/2),true);
  else if(act==='camreset'){c.kb={z0:1,x0:0,y0:0,z1:1,x1:0,y1:0};render();commit();renderInspector()}
}

/* ---------- commands ---------- */
function freeLane(start,end){
  for(let l=0;l<project.lanes;l++)
    if(!project.clips.some(c=>c.lane===l&&c.start<end&&c.end>start))return l;
  return 0;
}
function addClip(type,over){
  const start=snap(playhead), end=start+1.5;
  const c=newClip(type,Object.assign({start,end,lane:freeLane(start,end)},over));
  project.clips.push(c);
  sel=c.id;
  setPlayhead(start+.5,true);
  commit();render();renderInspector();
  return c;
}
async function addImages(files){
  for(const f of files){
    if(!f.type.startsWith('image/'))continue;
    const r=await readImage(f);
    if(r)addClip('image',{src:r.src,name:r.name});
  }
}
function deleteSel(){
  if(!sel)return;
  project.clips=project.clips.filter(c=>c.id!==sel);
  sel=null;commit();refreshAll();
}
function duplicateSel(){
  const c=byId(sel);if(!c)return;
  const d=c.end-c.start;
  const copy=newClip(c.type,JSON.parse(JSON.stringify(c)));
  copy.id=uid();copy.start=c.end;copy.end=snap(c.end+d);
  project.clips.push(copy);sel=copy.id;
  setPlayhead(copy.start+Math.min(.5,d/2),true);
  commit();render();renderInspector();
}

function pickFiles(accept,multiple){
  return new Promise(res=>{
    const i=document.createElement('input');i.type='file';i.accept=accept;i.multiple=!!multiple;
    i.onchange=()=>res([...i.files]);i.click();
  });
}
function readAsDataURL(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
}
// Big photos are shrunk so the exported file stays a reasonable size.
async function readImage(file){
  let src=await readAsDataURL(file);
  const name=(file.name||'pasted image').replace(/\.[^.]+$/,'');
  if(file.size>1.2e6&&file.type!=='image/svg+xml'&&file.type!=='image/gif'){
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
    const s=Math.min(1,1800/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    src=cv.toDataURL('image/webp',.88);
    if(!src.startsWith('data:image/webp'))src=cv.toDataURL('image/jpeg',.88);
  }
  return {src,name};
}

function buildExport(){

<meta name="generator" content="Scrollyteller">

<style>
html,body{margin:0;background:${p.bg}}
#track{position:relative;height:${(L+1)*100}vh}
#stage{position:sticky;top:0;width:100%;height:100vh;overflow:hidden;container-type:size}

${RUNTIME_CSS}
</style>
</head>
<body>
<div id="track"><div id="stage"></div></div>${p.progress?'\n<div id="bar"></div>':''}
<script type="application/json" id="scrolly-data">${json}<\/script>
<script>
${scrollyRuntime.toString()}
(function(){
  var P=JSON.parse(document.getElementById('scrolly-data').textContent),R=scrollyRuntime(),L=R.length(P),

  addEventListener('scroll',function(){if(!queued){queued=true;requestAnimationFrame(draw)}},{passive:true});

<\/script>

}
const slug=s=>(s||'story').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'story';
function download(name,text,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

async function openFile(){
  const [f]=await pickFiles('.json,.html,.htm,application/json,text/html');
  if(!f)return;
  const text=await f.text();
  let data;
  try{
    if(/^\s*</.test(text)){
      const m=text.match(/<script type="application\/json" id="scrolly-data">([\s\S]*?)<\/script>/);
      if(!m)throw new Error('no data');
      data=JSON.parse(m[1]);
    }else data=JSON.parse(text);
  }catch(e){toast('That file doesn’t look like a Scrollyteller project or story.');return}
  loadProject(data,true);
  toast(`Opened “${project.title}”.`);
}

const commands={
  addText:()=>addClip('text'),
  addImage:()=>pickFiles('image/*',true).then(addImages),
  undo,redo,
  newProject:()=>{if(confirm('Start a new, empty story? (Your current one can be brought back with Undo.)'))loadProject({title:'My story'},true)},
  open:openFile,
  save:()=>{download(slug(project.title)+'.scrolly.json',JSON.stringify(project),'application/json');toast('Project saved to your downloads. Use “Open…” to keep working on it later.')},
  preview:()=>{const w=window.open(URL.createObjectURL(new Blob([buildExport()],{type:'text/html'})),'_blank');if(!w)toast('Your browser blocked the preview tab. Allow pop-ups for this page.')},
  export:()=>{download(slug(project.title)+'.html',buildExport(),'text/html');toast('Exported! Open the downloaded .html file in any browser.')},
  zoomIn:()=>{pxPer=Math.min(240,pxPer*1.25);renderTimeline();setPlayhead(playhead,true)},
  zoomOut:()=>{pxPer=Math.max(30,pxPer/1.25);renderTimeline();setPlayhead(playhead,true)},
};

let toastTimer;
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3500);
}

/* ---------- pointer interactions ---------- */
function drag(move,up){
  const mv=e=>move(e);
  const u=e=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',u);up&&up(e)};
  addEventListener('pointermove',mv);addEventListener('pointerup',u);
}
const timeAt=y=>(y-$('#tl-body').getBoundingClientRect().top)/pxPer;

$('#tl-body').addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  e.preventDefault();
  const el=e.target.closest('.clip');
  if(!el){
    if(e.clientX-$('#tl-body').getBoundingClientRect().left>RULER)select(null);
    const scrub=ev=>setPlayhead(timeAt(ev.clientY));
    scrub(e);drag(scrub);
    return;
  }
  const c=byId(el.dataset.id);
  select(c.id);
  const mode=e.target.classList.contains('h-top')?'top':e.target.classList.contains('h-bot')?'bot':'move';
  if(mode==='move')setPlayhead(clamp(timeAt(e.clientY),c.start,c.end));
  const s0=c.start,e0=c.end,l0=c.lane,x0=e.clientX,y0=e.clientY;
  let moved=false;
  drag(ev=>{
    const dy=(ev.clientY-y0)/pxPer, dx=ev.clientX-x0;
    if(!moved&&Math.abs(ev.clientY-y0)<3&&Math.abs(dx)<3)return;
    moved=true;
    if(mode==='move'){
      c.start=Math.max(0,snap(s0+dy));c.end=snap(c.start+(e0-s0));
      c.lane=clamp(l0+Math.round(dx/laneW()),0,project.lanes-1);
    }else if(mode==='top')c.start=clamp(snap(s0+dy),0,snap(c.end-.2));
    else c.end=Math.max(snap(c.start+.2),snap(e0+dy));
    render();
  },()=>{if(moved){commit();syncInspector()}});
});

$('#pv-frame').addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  const fr=$('#pv-frame').getBoundingClientRect();
  let c=null, mode='move';
  if(e.target.classList.contains('rz')){c=byId(sel);mode='resize'}
  else if(e.target.id==='selbox')c=byId(sel);
  else{
    for(const el of document.elementsFromPoint(e.clientX,e.clientY)){
      const ce=el.closest&&el.closest('.sc-clip');
      if(ce){const m=mounted.find(m=>m.el===ce);if(m){c=m.c;break}}
    }
  }
  if(!c){select(null);return}
  e.preventDefault();
  select(c.id);
  const x0=e.clientX,y0=e.clientY,start={x:c.x,y:c.y,w:c.w,h:c.h};
  let moved=false;
  const r1=v=>Math.round(v*10)/10;
  drag(ev=>{
    const dx=(ev.clientX-x0)/fr.width*100, dy=(ev.clientY-y0)/fr.height*100;
    if(!moved&&Math.abs(ev.clientX-x0)<3&&Math.abs(ev.clientY-y0)<3)return;
    moved=true;
    if(mode==='move'){c.x=r1(start.x+dx);c.y=r1(start.y+dy)}
    else{c.w=r1(Math.max(3,start.w+dx));if(c.type==='image')c.h=r1(Math.max(3,start.h+dy))}
    renderPreview();
  },()=>{if(moved){commit();syncInspector()}});
});

$('#pv-frame').addEventListener('wheel',e=>{
  e.preventDefault();
  const d=e.deltaMode===1?e.deltaY*40:e.deltaY;
  setPlayhead(playhead+d/900,true);
},{passive:false});
$('#ph-slider').addEventListener('input',e=>setPlayhead(+e.target.value,true));

/* ---------- rich text editing ---------- */
let rtRange=null; // last selection inside the text editor, so toolbar clicks can act on it
document.addEventListener('selectionchange',()=>{
  const rt=$('#rt'),s=getSelection();
  if(rt&&s.rangeCount&&rt.contains(s.anchorNode))rtRange=s.getRangeAt(0).cloneRange();
});
function rtChanged(){
  const c=byId(sel),rt=$('#rt');
  if(!c||!rt)return;
  c.html=sanitize(rt.innerHTML);
  render();
}
function rtCmd(cmd,val){
  const rt=$('#rt');if(!rt)return;
  rt.focus();
  if(rtRange){const s=getSelection();s.removeAllRanges();s.addRange(rtRange)}
  if(cmd==='link'){
    const s=getSelection();
    let url=prompt('Link address (for example https://www.census.gov)','https://');
    if(!url||!url.trim()||url.trim()==='https://')return;
    url=url.trim();
    if(!/^[a-z]+:/i.test(url))url=(/@/.test(url)&&!/\//.test(url)?'mailto:':'https://')+url;
    rt.focus();
    if(rtRange){s.removeAllRanges();s.addRange(rtRange)}
    if(s.isCollapsed)document.execCommand('insertHTML',false,`<a href="${esc(url)}">${esc(url)}</a>`);
    else document.execCommand('createLink',false,url);
  }else document.execCommand(cmd,false,val);
  rtChanged();commit();
}
$('#inspector').addEventListener('mousedown',e=>{if(e.target.closest('[data-rt]'))e.preventDefault()});
$('#inspector').addEventListener('click',e=>{const b=e.target.closest('[data-rt]');if(b)rtCmd(b.dataset.rt)});
$('#inspector').addEventListener('focusout',e=>{if(e.target.id==='rt')commit()});
$('#inspector').addEventListener('paste',e=>{
  const node=e.target.nodeType===1?e.target:e.target.parentElement;
  if(!node||!node.closest('#rt'))return;
  e.preventDefault();
  const html=e.clipboardData.getData('text/html');
  if(html)document.execCommand('insertHTML',false,sanitize(html));
  else document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));
});
// links in the editor preview shouldn't navigate away
$('#stage').addEventListener('click',e=>{if(e.target.closest('a'))e.preventDefault()});

/* ---------- inspector events ---------- */
$('#inspector').addEventListener('input',e=>{
  if(e.target.id==='rt')rtChanged();
  else if(e.target.dataset.k)applyField(e.target);
});
$('#inspector').addEventListener('change',e=>{
  if(e.target.id==='rt-color')return rtCmd('foreColor',e.target.value);
  if(!e.target.dataset.k)return;
  const c=byId(sel);
  if(c&&c.end<c.start+0.1){c.end=snap(c.start+0.1);render()}
  commit();
  if(e.target.dataset.k==='lanes')render();
  syncInspector();
});
$('#inspector').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(b)clipAction(b.dataset.act,b);
});

/* ---------- toolbar, keyboard, paste, drop ---------- */
document.querySelectorAll('[data-cmd]').forEach(b=>b.addEventListener('click',()=>commands[b.dataset.cmd]()));

addEventListener('keydown',e=>{
  const typing=isTyping(e.target);
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo()}
  else if(mod&&e.key.toLowerCase()==='y'&&!typing){e.preventDefault();redo()}
  else if(mod&&e.key.toLowerCase()==='d'&&sel){e.preventDefault();duplicateSel()}
  else if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();commands.save()}
  else if((e.key==='Delete'||e.key==='Backspace')&&sel&&!typing){e.preventDefault();deleteSel()}
  else if(e.key==='Escape'&&!typing)select(null);
});

addEventListener('paste',e=>{
  if(isTyping(document.activeElement))return;
  const files=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));
  if(files.length){e.preventDefault();addImages(files)}
});
addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('Files')){e.preventDefault();document.body.classList.add('dragover')}});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('dragover')});
addEventListener('drop',e=>{
  e.preventDefault();document.body.classList.remove('dragover');
  addImages([...e.dataTransfer.files]);
});

new ResizeObserver(()=>{sizeFrame();renderTimeline()}).observe($('#pv-area'));
new ResizeObserver(()=>renderTimeline()).observe($('#tl-scroll'));
addEventListener('beforeunload',()=>commit());

/* ---------- demo story (a tiny descriptive-stats example) ---------- */
function demoChart(){
  const counts=[1,1,3,6,8,5,2,1,0,0,1]; // hours 4..14, n = 28
  const W=800,H=520,ml=70,mr=24,mt=70,mb=70,bw=(W-ml-mr)/counts.length,max=8,ph=H-mt-mb;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" font-family="system-ui,sans-serif">
  <rect width="${W}" height="${H}" rx="18" fill="#ffffff"/>
  <text x="${ml}" y="42" font-size="26" font-weight="700" fill="#111827">Hours of sleep last night (n = 28)</text>`;
  for(let v=0;v<=max;v+=2){
    const y=mt+ph-ph*v/max;
    s+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" stroke="#e5e7eb"/><text x="${ml-12}" y="${y+6}" font-size="17" fill="#6b7280" text-anchor="end">${v}</text>`;
  }
  counts.forEach((n,i)=>{
    const h=ph*n/max,x=ml+i*bw;
    s+=`<rect x="${x+4}" y="${mt+ph-h}" width="${bw-8}" height="${h}" rx="4" fill="${i===10?'#f43f5e':'#3b82f6'}"/>`;
    s+=`<text x="${x+bw/2}" y="${H-mb+26}" font-size="17" fill="#374151" text-anchor="middle">${4+i}</text>`;
  });
  s+=`<text x="${(ml+W-mr)/2}" y="${H-14}" font-size="18" fill="#374151" text-anchor="middle">Hours</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
}
function demoProject(){
  const card={bg:'#000000',bgOpacity:55};
  return {title:'How much do we sleep?',bg:'#0f172a',clips:[
    newClip('text',{text:'How much do we sleep?',size:95,bold:true,align:'center',x:5,y:30,w:90,start:0,end:1.4,enter:'none',exit:'fade',exitLen:.4}),
    newClip('text',{text:'A story about descriptive statistics\n↓ scroll ↓',size:35,align:'center',color:'#93c5fd',x:10,y:55,w:80,lane:1,start:0,end:1.2,enter:'none',exit:'fade'}),
    newClip('image',{src:demoChart(),name:'sleep histogram',alt:'Histogram of hours slept by 28 students',x:4,y:10,w:54,h:80,
      start:1.2,end:6.4,enter:'left',enterLen:.5,exit:'fade',exitLen:.4,kb:{z0:1,x0:0,y0:0,z1:1.6,x1:100,y1:50}}),
    newClip('text',Object.assign({text:'We asked 28 students how many hours they slept last night.',x:62,y:34,w:34,lane:1,start:1.6,end:2.9,enter:'right'},card)),
    newClip('text',Object.assign({text:'Most of us slept 7 to 9 hours.\n\nThe median is 8 hours.\nThe mean is 7.96 hours.',x:62,y:30,w:34,lane:1,start:3.0,end:4.3,enter:'right'},card)),
    newClip('text',Object.assign({html:'But one person slept <b style="color:#f43f5e">14 hours</b>!<br><br>That’s an <i>outlier</i>: more than 1.5 × IQR above Q3.',x:62,y:30,w:34,lane:1,start:4.4,end:6.2,enter:'zoom',motion:'drift',enterLen:.4},card)),
    newClip('text',{html:'Range: 10 hours.<br>IQR: 2 hours.<br><br>One outlier can make the range tell a very different story.<br><br><a href="https://en.wikipedia.org/wiki/Interquartile_range">What’s an IQR?</a>',size:55,align:'center',x:10,y:28,w:80,start:6.6,end:8,enter:'bottom',enterLen:.5,exit:'none'}),
  ]};
}

/* ---------- boot ---------- */
(function boot(){
  document.head.insertAdjacentHTML('beforeend',`<style>${RUNTIME_CSS}</style>`);
  let saved=null;
  try{saved=localStorage.getItem(STORE_KEY)}catch(e){}
  try{loadProject(saved?JSON.parse(saved):demoProject())}catch(e){loadProject(demoProject())}
})();
</script>
